<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intent Pipeline &mdash; Live Demo</title>
  <link rel="stylesheet" href="/demo/static/style.css" />
</head>
<body>
  <header>
    <h1>Intent Pipeline &mdash; Live Demo</h1>
    <div class="header-meta">
      <span>tenant <code id="tenant-id">&hellip;</code></span>
      <span>call <code id="call-id">&hellip;</code></span>
      <button id="upload-transcript" class="header-btn" type="button">Upload transcript</button>
      <input id="transcript-file" type="file" accept=".txt" hidden />
      <button id="stop-playback" class="header-btn" type="button" hidden>Stop</button>
      <button id="new-call" class="header-btn" type="button">New call</button>
    </div>
  </header>

  <main>
    <section class="left">
      <div id="transcript" aria-live="polite"></div>
      <div id="flash" hidden></div>
      <div class="composer">
        <div class="speaker-toggle" role="group" aria-label="Speaker">
          <button id="speaker-customer" type="button" class="speaker-btn active" data-speaker="Customer">Customer</button>
          <button id="speaker-agent" type="button" class="speaker-btn" data-speaker="Agent">Agent</button>
        </div>
        <div class="speaker-toggle" role="group" aria-label="Answer mode">
          <button id="mode-focused" type="button" class="speaker-btn active"
                  title="Tool answers: one or two sentences answering what was asked">Focused</button>
          <button id="mode-full" type="button" class="speaker-btn"
                  title="Tool answers: what was asked, then every record and its key details (slower)">Full</button>
        </div>
        <input id="utterance" type="text" autocomplete="off" spellcheck="false"
               placeholder="Type what they said and press Enter" />
        <button id="send" type="button">Send</button>
        <span id="spinner" hidden>working&hellip;</span>
      </div>
    </section>

    <section class="right">
      <div class="panel" id="panel-intent">
        <div class="panel-head"><span class="panel-num">1</span> Intent identification</div>
        <div class="panel-body"></div>
      </div>
      <div class="panel" id="panel-slots">
        <div class="panel-head"><span class="panel-num">2</span> Slot extraction across turns</div>
        <div class="panel-body"></div>
      </div>
      <div class="panel" id="panel-mcp">
        <div class="panel-head"><span class="panel-num">3</span> MCP tool call &amp; answer</div>
        <div class="panel-body"></div>
      </div>
    </section>
  </main>

  <script src="/demo/static/app.js"></script>
</body>
</html>
